allprojects {
    afterEvaluate { p ->
        def delayedStringClass = p.tasks.findByName('downloadClient')?.class?.classLoader?.loadClass('net.minecraftforge.gradle.delayed.DelayedString')
        if (!delayedStringClass) {
            return
        }

        def fixTaskUrl = { taskName, url ->
            def task = p.tasks.findByName(taskName)
            if (task != null) {
                def delayed = delayedStringClass.getConstructor(org.gradle.api.Project, String).newInstance(p, url)
                task.setUrl(delayed)
                println "fixed ${taskName} -> ${task.getUrl()}"
            }
        }

        fixTaskUrl('downloadClient', 'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar')
        fixTaskUrl('downloadServer', 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar')
        fixTaskUrl('getVersionJson', 'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json')
        fixTaskUrl('getAssetsIndex', 'https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/{ASSET_INDEX}.json')
    }
}
